# ============================================================
# 九、配图（每篇最多 1 张，取论文的 Figure 1）
#
# 图片来源是 arXiv HTML 版（会议论文集只给 PDF，抽图不干净）。
# 会议论文会先按标题精确反查 arXiv 版本再取图。
#
# 两条底线：
#   图注逐字引用原文，不改写不翻译（大模型看不懂图，描述图就是编造）；
#   取不到 Figure 1 就跳过，不拿别的图顶替。
# ============================================================

figures:
  enabled: true

  # 宽度上限（像素）。arXiv 原图常有 6000px 宽、2MB 以上，
  # 公众号正文单图上限约 1MB，不压会被拒。
  max_width: 1200
  max_bytes: 900000

  # 图片落盘位置：output/<期号>-vol<NN>-<主题组>/figures/<序号>.png
  # 文章里用相对路径引用，HTML 与 Markdown 都能直接显示。


# ============================================================
# 十、文章生成要求
# ============================================================

article:
  # 声明性：中文输出与「通俗解读 + 技术要点」的写法由 prompts 固定
  language: zh-CN
  articles_per_issue: 1
  depth: "通俗解读 + 技术要点"

  # 声明性：章节结构由 prompts 与渲染器固定，不按此表动态拼装
  sections:
    - issue_introduction
    - paper_title
    - publication_date
    - venue
    - publication_status
    - research_problem
    - previous_methods
    - core_innovation
    - technical_details
    - experimental_results
    - limitations
    - practical_applications
    - official_paper_url
    - github_url
    - issue_summary

  include_source_links: true
  include_verified_code_links: true
  show_publication_status: true
  require_verifiable_experimental_results: true
  allow_fabricated_claims: false

  # 与 publishing.save_markdown / save_html 同时生效：两者都允许才输出该格式
  output_formats:
    - markdown
    - html

  # ---- 篇幅预算 ----
  # 每期篇数由 schedule.select_count 决定（3/3/4），篇幅按篇数换算：
  # 3 篇时正文约 3270 字，4 篇时约 4170 字。
  # 实测大模型对字数上限执行偏松（超 20~40%），超出部分写进校验报告但不阻断发布。
  tolerance: 1.25
  field_budgets:
    one_line_summary: [0, 40]
    background: [80, 110]
    core_problem: [60, 90]
    prior_work: [70, 100]
    innovation: [80, 110]
    method: [130, 170]
    experiments: [70, 100]
    limitations: [50, 80]
    practical_value: [70, 100]
  synthesis_budgets:
    intro: [150, 220]
    connections: [100, 150]
    trend: [70, 100]
    next_steps: [70, 100]


# ============================================================
# 十、公众号发布策略
# ============================================================

publishing:
  # 声明性：本项目只做本地生成，没有远程发布通道
  mode: local
  # 生效：与 article.output_formats 共同决定本期输出哪些文件
  save_markdown: true
  save_html: true

  # 出稿后把「本期已生成」推到微信（PushPlus，token 见 .env 的 PUSHPLUS_TOKEN）。
  # 云端定时跑时这条是刚需：没人盯着终端，成功与失败都得让你知道。
  notify:
    enabled: true

  wechat:
    # 生效：true 且配好 WECHAT_APPID / WECHAT_APPSECRET / WECHAT_COVER_IMAGE 时建草稿。
    # 注意：调用来源 IP 必须在公众号的 IP 白名单里，GitHub Actions 的动态 IP
    # 会被 40164 拒绝，所以这一项目前只能在白名单内的机器上跑（见 README）。
    enabled: false
    # 以下两项订阅号没有权限，置 true 只会收到一条告警，程序仍只建草稿
    auto_publish: false
    auto_mass_send: false

    # 声明性：人工复核流程本身不在程序里强制执行
    require_manual_review: true


# ============================================================
# 十一、历史记录与去重
# ============================================================

storage:
  type: json

  # 历史库位置。相对路径按项目根目录解析。
  paper_history_path: data/published.json

  # 声明性：程序实际使用的稳定标识是「arXiv ID / DOI / OpenAlex ID / 官方论文页地址」
  # 这一组超集。之所以不止 doi 与 arxiv_id，是因为会议论文集论文两者都没有，
  # 只认这两项会让它们失去去重能力，从而跨期重复推荐。
  deduplication_keys:
    - doi
    - arxiv_id
  count_only_finalized_articles: true
  # 声明性：公众号发布状态跟踪依赖发布流程，目前 publishing 未启用自动发布
  track_publication_status: true